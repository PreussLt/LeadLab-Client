[package]
name = "leadlab-client"
version = "0.1.0"
description = "LeadLab-Client: verbindet den Arbeitsplatz mit einem LeadLab-Server und hält Gelände-, Karten- und Gebäudedaten lokal vor"
authors = ["Vanguard LeadLab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "leadlab_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "net", "time"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package]
name = "leadlab-client"
version = "0.1.0"
description = "LeadLab-Client: verbindet den Arbeitsplatz mit einem LeadLab-Server und hält Gelände-, Karten- und Gebäudedaten lokal vor"
authors = ["Vanguard LeadLab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "leadlab_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "net", "time"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
# Anmeldung (CS4, #759; AD2, #798): PKCE, Systembrowser, Tokens im
# verschlüsselten Tresor des Konfigurationsordners (ChaCha20-Poly1305).
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
open = "5"
# Auto-Update (CS9, #764): Manifest kommt aus client_update der Konfigurationsadresse.
tauri-plugin-updater = "2"
# Loopback-Server (CS7, #762): PMTiles-Verzeichnisse und LoD2-Manifeste sind gzip.
flate2 = "1"
# Nur noch für die Übernahme eines Refresh-Tokens aus dem Schlüsselbund der
# Fassung CS4 in den Tresor (AD2, #798); entfällt, wenn alle Arbeitsplätze
# übernommen haben.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

# Geräteschlüssel des Tresors unter Windows: DPAPI im Nutzerbereich (AD2, #798).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
